[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mica"
version = "0.1.0"
description = "Contract-first runtime for polyglot, multi-process applications"
requires-python = ">=3.12"
dependencies = [
  "nats-py>=2.9.0",
  "protobuf>=4.21.12,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
