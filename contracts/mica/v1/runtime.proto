syntax = "proto3";

package mica.v1;

option go_package = "mica/generated/go/mica/v1;micav1";

enum RpcCode {
  RPC_CODE_UNSPECIFIED = 0;
  RPC_CODE_OK = 1;
  RPC_CODE_INVALID_ARGUMENT = 2;
  RPC_CODE_NOT_FOUND = 3;
  RPC_CODE_UNAVAILABLE = 4;
  RPC_CODE_INTERNAL = 5;
}

message RpcStatus {
  RpcCode code = 1;
  string message = 2;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_STARTING = 1;
  STATE_RUNNING = 2;
  STATE_STOPPING = 3;
  STATE_STOPPED = 4;
  STATE_FAILED = 5;
}

message Health {
  State state = 1;
  string message = 2;
  uint64 uptime_ms = 3;
}

message Envelope {
  uint32 protocol_version = 1;
  string message_id = 2;
  string sender_id = 3;
  uint64 timestamp_ns = 4;
  string contract_id = 5;
  RpcStatus status = 6;
  bytes payload = 7;
}
