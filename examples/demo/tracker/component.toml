[component]
name = "tracker"
language = "python"

publishes = [
  "tracking.v1.PersonTracked",
]

subscribes = [
  "camera.v1.PoseChanged",
]

calls = []

provides = []

[build]
adapter = "python"

[build.python]
source = "."
module = "tracker"

[artifact]
kind = "python"
path = "."

[run]
command = "python3"
args = ["-m", "tracker"]

[requirements]
executables = ["python3"]

[requirements.python]
version = ">=3.12"
packages = ["nats-py>=2.9.0", "protobuf>=4.21.12,<6"]
